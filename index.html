<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Wycinanka — learn Polish</title>
    <meta name="description" content="A free Polish course for English speakers: short lessons, spaced review, the 500 most useful words and the sounds of Polish." />
    <!-- The page's paper colour, so the browser bar and status bar match the app. Kept in step with the theme setting by store.ts. -->
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#141210" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Wycinanka" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  </head>
  <body>
    <!-- Shown until the app starts, so a browser that cannot run it never sees an empty white page. -->
    <div id="root">
      <div class="boot" aria-busy="true">
        <p class="boot-brand">Wycinanka</p>
        <p class="boot-help">
          Still loading? Wycinanka needs JavaScript. If you use Brave, turn off “Block Scripts” in Shields for this
          site; otherwise update your browser (on an iPad, update iPadOS) and reload.
        </p>
      </div>
    </div>
    <noscript>Wycinanka needs JavaScript to run lessons.</noscript>
    <script src="/boot-watch.js" defer></script>
    <script type="module" src="/src/app/main.tsx"></script>
  </body>
</html>
